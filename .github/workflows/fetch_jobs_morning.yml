name: Fetch Jobs (Morning)

on:
  schedule:
    # 11:00 UTC = 7:00 AM EDT / 6:00 AM EST.
    # GitHub Actions cron may delay 15-30 min during peak hours — that's fine.
    - cron: '0 11 * * *'
  workflow_dispatch:  # lets you trigger manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run fetcher
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_APPLICATIONS_DB_ID: ${{ secrets.NOTION_APPLICATIONS_DB_ID }}
          NOTION_CONTACTS_DB_ID: ${{ secrets.NOTION_CONTACTS_DB_ID }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_UNIVERSAL_ACTOR_ID: ${{ secrets.APIFY_UNIVERSAL_ACTOR_ID }}
          LOG_LEVEL: INFO
        run: uv run python scripts/fetch_jobs.py