name: Auto-discover contacts (daily)

on:
  schedule:
    - cron: "0 14 * * 1-5"  # Mon-Fri 9am ET (14:00 UTC)
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Discover contacts
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_APPLICATIONS_DB_ID: ${{ secrets.NOTION_APPLICATIONS_DB_ID }}
          NOTION_CONTACTS_DB_ID: ${{ secrets.NOTION_CONTACTS_DB_ID }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: uv run python scripts/auto_discover_contacts.py --apply
