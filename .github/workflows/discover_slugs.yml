name: Discover ATS Slugs (weekly)

on:
  schedule:
    - cron: "0 2 * * 0"  # Sunday 2am UTC — before the Sunday 4am UTC backup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run slug discovery
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_APPLICATIONS_DB_ID: ${{ secrets.NOTION_APPLICATIONS_DB_ID }}
          NOTION_CONTACTS_DB_ID: ${{ secrets.NOTION_CONTACTS_DB_ID }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          LOG_LEVEL: INFO
        # 3 keywords x 6 ATSes = 18 queries/run. At weekly cadence (~4.3
        # runs/month) that's ~78 queries/month, under SerpAPI's 100/mo free
        # tier. The script's own default (all 6 keywords, 36/run) is only
        # for manual/local runs, which don't repeat weekly.
        run: >
          uv run python scripts/discover_ats_slugs.py --apply
          --role-keywords "AI Engineer" "ML Engineer" "Data Scientist"

      - name: Commit new slugs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-discover new ATS slugs [skip ci]"
          file_pattern: "data/companies/*.json"
